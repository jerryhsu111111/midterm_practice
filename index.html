<footer>題庫：化工概論四講投影片與 2026 期中考延伸題。原題號、答案、錯誤敘述解釋及投影片出處均保留。本版使用 88 題原題庫（排除指定 12 題）＋ 19 題新增題。</footer></main><script>
const QUESTIONS=[{"id":1,"text":"化工系的核心課程除了化學反應，也包含熱力學、流體力學、熱質傳及分離程序。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"7","source":"ChE_01"},{"id":2,"text":"熱力學主要用來判斷化學反應的速率有多快。","answer":false,"explanation":"熱力學主要判斷反應的可行性、平衡與極限；反應速率屬於動力學與反應工程。","category":"第一講：化工概論與產業","pages":"7","source":"ChE_01"},{"id":3,"text":"即使某化學反應在熱力學上可行，實際反應速率仍可能非常慢。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"7","source":"ChE_01"},{"id":4,"text":"流體力學及熱質傳只適用於石化產業，與半導體製程沒有直接關係。","answer":false,"explanation":"半導體的氣體輸送、散熱、薄膜沉積及設備流場等都涉及流體力學與熱質傳。","category":"第一講：化工概論與產業","pages":"7","source":"ChE_01"},{"id":5,"text":"現代化工產業除了傳統石化，也涵蓋半導體、生物科技及機能材料等領域。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"8","source":"ChE_01"},{"id":6,"text":"現代半導體供應商的角色僅是交付符合規格的產品，通常不需要參與客戶製程開發。","answer":false,"explanation":"投影片指出產業關係已從供應商資格認證進展到技術夥伴、共同開發與持續改善。","category":"第一講：化工概論與產業","pages":"9","source":"ChE_01"},{"id":7,"text":"AI 伺服器產業的發展，也可能增加電力、冷卻及特殊化學品的需求。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"10","source":"ChE_01"},{"id":8,"text":"木炭燃燒的速率一定完全由化學反應速率決定，與氧氣的傳輸無關。","answer":false,"explanation":"燃燒可能由反應控制轉為氧氣傳輸控制。","category":"第一講：化工概論與產業","pages":"13","source":"ChE_01"},{"id":9,"text":"提高氧氣供應與質傳速率，有可能加快受到氧氣傳輸限制的燃燒。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"13","source":"ChE_01"},{"id":10,"text":"兩顆儲存能量相同的電池，在不同時間內釋放能量，其平均功率必定相同。","answer":false,"explanation":"功率等於能量除以時間，放電時間愈短，平均功率愈高。","category":"第一講：化工概論與產業","pages":"14","source":"ChE_01"},{"id":11,"text":"100 kWh 相當於約 360 MJ 的能量。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"14","source":"ChE_01"},{"id":12,"text":"電池熱失控只需考慮儲存的電能，與熱量產生、熱傳及散熱無關。","answer":false,"explanation":"電池熱失控與產熱、放熱反應及散熱能力密切相關。","category":"第一講：化工概論與產業","pages":"14","source":"ChE_01"},{"id":13,"text":"Haber-Bosch 合成氨需要兼顧反應速率與平衡轉化率。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"15","source":"ChE_01"},{"id":14,"text":"氨合成製程只需要化學反應器，不需要氣體分離、壓縮或熱交換設備。","answer":false,"explanation":"投影片中的流程包含重組、分離、壓縮、熱交換、反應與冷凝設備。","category":"第一講：化工概論與產業","pages":"16","source":"ChE_01"},{"id":15,"text":"製造高純度矽的過程，可以利用化學反應將矽轉成可供純化的化合物。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"19","source":"ChE_01"},{"id":16,"text":"冶金級矽純度約為 99.9%，因此可直接滿足所有先進半導體製程的純度要求。","answer":false,"explanation":"半導體用電子級矽要求更高純度，投影片列出大於 99.99999%。","category":"第一講：化工概論與產業","pages":"18","source":"ChE_01"},{"id":17,"text":"三氯矽烷可以經由蒸餾程序純化，再用於製造高純度矽。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"19","source":"ChE_01"},{"id":18,"text":"蒸餾只適合用於酒精飲料製造，不能用於半導體材料的純化。","answer":false,"explanation":"蒸餾是重要分離程序，投影片以高純度矽的製造為例。","category":"第一講：化工概論與產業","pages":"20","source":"ChE_01"},{"id":19,"text":"台灣的化工產業歷史包含化肥、紡織、塑膠、石化與特殊材料等不同階段。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"21","source":"ChE_01"},{"id":20,"text":"人類頭髮的直徑約為 50 nm，與先進電晶體特徵尺寸相近。","answer":false,"explanation":"投影片中的頭髮直徑約為 50 μm，也就是 50,000 nm，遠大於奈米級電晶體特徵尺寸。","category":"第一講：化工概論與產業","pages":"22","source":"ChE_01"},{"id":22,"text":"摩爾定律表示單一電晶體的尺寸必須每 18 個月增加一倍。","answer":false,"explanation":"投影片使用的摩爾定律表述是晶片上的電晶體數量約每 18 個月增加一倍。","category":"第一講：化工概論與產業","pages":"25","source":"ChE_01"},{"id":23,"text":"化學工程中的產品品質與製程產能，是兩項不同而且都很重要的設計目標。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"28","source":"ChE_01"},{"id":24,"text":"只要化工產品品質夠好，生產成本、安全性及環境永續性都不必考慮。","answer":false,"explanation":"化工工程的挑戰還包括產能、速率、成本、壽命、安全與永續性。","category":"第一講：化工概論與產業","pages":"28","source":"ChE_01"},{"id":25,"text":"在化工製程設計中，反應或生產速率並不一定愈快愈好。","answer":true,"explanation":"","category":"第一講：化工概論與產業","pages":"28","source":"ChE_01"},{"id":29,"text":"摩爾定律是由能量守恆定律推導出的基本物理定律。","answer":false,"explanation":"摩爾定律是描述半導體技術進展的經驗趨勢，而非能量守恆所推導的定律。","category":"第二講：半導體產業與製程","pages":"5","source":"ChE_02"},{"id":30,"text":"在長寬均縮小至原來 0.7 倍時，元件面積約成為原來的一半。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"11","source":"ChE_02"},{"id":31,"text":"如果每個製程步驟成功率都是 90%，連續 100 個步驟的總成功率仍為 90%。","answer":false,"explanation":"若每步獨立且都必須成功，總成功率約為 0.9¹⁰⁰ ≈ 0.0027%。","category":"第二講：半導體產業與製程","pages":"11","source":"ChE_02"},{"id":32,"text":"半導體製程需要嚴格控制微粒污染，因為缺陷可能降低良率。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"17","source":"ChE_02"},{"id":33,"text":"HEPA 濾網的主要用途是提高晶圓表面的電子導電率。","answer":false,"explanation":"HEPA 是高效能空氣微粒過濾設備，主要用來降低空氣中的顆粒污染。","category":"第二講：半導體產業與製程","pages":"17","source":"ChE_02"},{"id":34,"text":"半導體製程中的薄膜沉積、微影、蝕刻與光阻去除，可以組成圖案化製造流程。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"8","source":"ChE_02"},{"id":35,"text":"正型光阻經過曝光後，曝光區通常變得更不容易被顯影液溶解。","answer":false,"explanation":"投影片描述正型光阻曝光區變得可溶，顯影時被移除。","category":"第二講：半導體產業與製程","pages":"8","source":"ChE_02"},{"id":36,"text":"半導體蝕刻製程可以分為濕式與乾式蝕刻。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"8","source":"ChE_02"},{"id":37,"text":"FEOL 主要是晶片的金屬互連線製作，BEOL 則主要是電晶體形成。","answer":false,"explanation":"FEOL 主要形成電晶體等元件結構，BEOL 主要形成多層金屬互連。","category":"第二講：半導體產業與製程","pages":"14","source":"ChE_02"},{"id":38,"text":"先進半導體製程節點的名稱，不一定等於晶片中某個實際結構的物理尺寸。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"15","source":"ChE_02"},{"id":39,"text":"EUV 微影使用的波長約為 193 nm。","answer":false,"explanation":"投影片列出 EUV 約為 13.5 nm；193 nm 是另一種深紫外光微影波長。","category":"第二講：半導體產業與製程","pages":"24","source":"ChE_02"},{"id":40,"text":"半導體微影技術的發展，包含從汞燈光源逐步推進到雷射與 EUV 光源。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"24","source":"ChE_02"},{"id":42,"text":"不同材料的熱膨脹係數不同，是半導體製程需要精密控溫的原因之一。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"25","source":"ChE_02"},{"id":43,"text":"銅互連製程和傳統鋁互連製程的圖案形成方式完全相同，不需要調整製程步驟。","answer":false,"explanation":"投影片比較了鋁線蝕刻與銅鑲嵌式製程；銅製程包括介電層圖案化、填銅及移除多餘銅。","category":"第二講：半導體產業與製程","pages":"27","source":"ChE_02"},{"id":44,"text":"CMP 結合化學作用與機械研磨，可用於晶圓表面的平坦化。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"29","source":"ChE_02"},{"id":45,"text":"晶圓表面愈不平整，後續微影製程就必然愈容易對焦。","answer":false,"explanation":"多層結構造成的表面高低差會增加微影與後續加工困難，因此需要平坦化。","category":"第二講：半導體產業與製程","pages":"28","source":"ChE_02"},{"id":46,"text":"半導體產業包含 IC 設計、晶圓製造、封裝測試，以及材料與設備供應。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"35","source":"ChE_02"},{"id":47,"text":"晶圓代工廠（Foundry）的主要商業模式就是設計自有品牌手機，與 IC 製造無關。","answer":false,"explanation":"Foundry 主要為客戶提供晶片製造服務，屬於半導體製造產業鏈。","category":"第二講：半導體產業與製程","pages":"38","source":"ChE_02"},{"id":48,"text":"半導體產業同時存在上下游公司的競爭與合作關係。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"38","source":"ChE_02"},{"id":49,"text":"More than Moore 的概念僅包含把電晶體持續縮小，不涉及功能整合與先進封裝。","answer":false,"explanation":"More than Moore 強調功能多樣化、系統整合及封裝等發展方向。","category":"第二講：半導體產業與製程","pages":"41","source":"ChE_02"},{"id":50,"text":"CoWoS、InFO 與 SoIC 都出現在投影片介紹的先進封裝技術中。","answer":true,"explanation":"","category":"第二講：半導體產業與製程","pages":"42","source":"ChE_02"},{"id":51,"text":"化工製程設計除了生產速率和成本，也應考慮產量、品質、安全與永續性。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"5","source":"ChE_03"},{"id":52,"text":"青黴素被發現後，立刻就能以低成本無限制地大量生產。","answer":false,"explanation":"青黴素量產經歷了從實驗室生產到工業化的過程，仍須克服供氧、攪拌、反應器設計及控溫問題。","category":"第三講：傳統化工與供應鏈","pages":"6","source":"ChE_03"},{"id":53,"text":"青黴素的工業化量產需要解決發酵槽中的氧氣供應問題。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"7","source":"ChE_03"},{"id":54,"text":"在發酵製程中，攪拌愈快必然愈好，因此完全不用考慮攪拌強度。","answer":false,"explanation":"攪拌過慢可能造成混合或供氧不足，過快則可能帶來高能耗或不利的剪切作用。","category":"第三講：傳統化工與供應鏈","pages":"7","source":"ChE_03"},{"id":55,"text":"反應器設計需要考慮材質、攪拌功率、進氣、監測及溫度控制。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"8","source":"ChE_03"},{"id":56,"text":"放熱反應器只需要持續加熱，不需要設計移除熱量的設備。","answer":false,"explanation":"放熱反應可能造成溫度上升，必須評估散熱與控溫能力。","category":"第三講：傳統化工與供應鏈","pages":"8","source":"ChE_03"},{"id":57,"text":"Haber-Bosch 製程的核心反應是氮氣與氫氣合成氨。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"9","source":"ChE_03"},{"id":58,"text":"合成氨為放熱反應，因此提高溫度一定同時有利於反應速率與平衡轉化率。","answer":false,"explanation":"升溫通常有利反應速率，但對放熱反應的平衡轉化率不利，必須權衡。","category":"第三講：傳統化工與供應鏈","pages":"9","source":"ChE_03"},{"id":59,"text":"工業合成氨需要考慮催化劑的選擇。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"9","source":"ChE_03"},{"id":60,"text":"綠氫主要是利用煤炭氣化製造的氫氣。","answer":false,"explanation":"投影片中的綠氫以再生能源供電，透過電解水製造；煤炭氣化主要對應褐氫。","category":"第三講：傳統化工與供應鏈","pages":"10","source":"ChE_03"},{"id":61,"text":"藍氫通常指化石燃料製氫搭配二氧化碳捕捉與封存等減碳技術。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"10","source":"ChE_03"},{"id":62,"text":"粉紅氫是指以太陽能發電搭配電解水生產的氫氣。","answer":false,"explanation":"投影片將粉紅氫列為核能供電電解水；再生能源電解水對應綠氫。","category":"第三講：傳統化工與供應鏈","pages":"10","source":"ChE_03"},{"id":63,"text":"合成氨工廠可以透過冷卻與冷凝，將氨與未反應氣體分離。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"12","source":"ChE_03"},{"id":64,"text":"在合成氨反應中，催化劑可以改變反應的平衡常數，使平衡轉化率超過熱力學限制。","answer":false,"explanation":"催化劑改變反應速率，不改變固定溫度下的平衡常數及平衡組成。","category":"第三講：傳統化工與供應鏈","pages":"11","source":"ChE_03"},{"id":67,"text":"石化產業的供應鏈可以分為上游基本原料、中游材料及下游製品。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"14","source":"ChE_03"},{"id":68,"text":"乙烯只能用於燃燒供熱，不能成為塑膠材料的上游原料。","answer":false,"explanation":"乙烯可用於生產聚乙烯等塑膠，也能進一步製造成其他中間體。","category":"第三講：傳統化工與供應鏈","pages":"16","source":"ChE_03"},{"id":69,"text":"聚乙烯（PE）是乙烯的重要下游產品之一。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"16","source":"ChE_03"},{"id":70,"text":"PVC 的主要單體是丙烯，因此 PVC 屬於聚丙烯產品。","answer":false,"explanation":"PVC 是聚氯乙烯，單體為氯乙烯（VCM），與聚丙烯（PP）不同。","category":"第三講：傳統化工與供應鏈","pages":"18","source":"ChE_03"},{"id":71,"text":"頁岩氣中的乙烷可作為製造乙烯的原料。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"19","source":"ChE_03"},{"id":72,"text":"頁岩氣中的甲烷、乙烷與丙烷都可以直接聚合成聚乙烯。","answer":false,"explanation":"聚乙烯的單體為乙烯；乙烷須先轉化為乙烯，甲烷與丙烷不能直接聚合成 PE。","category":"第三講：傳統化工與供應鏈","pages":"19","source":"ChE_03"},{"id":73,"text":"鹼氯工業以鹽為重要原料，可產出氯氣與氫氧化鈉等化學品。","answer":true,"explanation":"","category":"第三講：傳統化工與供應鏈","pages":"20","source":"ChE_03"},{"id":74,"text":"電子級化學品只需考慮化學成分名稱，不必在意純度與雜質控制。","answer":false,"explanation":"電子級化學品需嚴格控管純度、雜質與品質，以符合電子製程需求。","category":"第三講：傳統化工與供應鏈","pages":"20","source":"ChE_03"},{"id":76,"text":"能量守恆定律要求，在適當定義的封閉系統中，能量不會憑空產生或消失。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"15","source":"ChE_04"},{"id":77,"text":"1 kWh 的能量等於 1,000 J。","answer":false,"explanation":"1 kWh = 1000 W × 3600 s = 3.6×10⁶ J，也就是 3.6 MJ。","category":"第四講：質能平衡與熱力學","pages":"9","source":"ChE_04"},{"id":78,"text":"1 W 等於每秒傳遞或轉換 1 J 的能量。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"9","source":"ChE_04"},{"id":79,"text":"功率與能量是相同物理量，因此 100 W 就代表 100 J。","answer":false,"explanation":"功率單位 W = J/s，能量單位是 J，兩者意義不同。","category":"第四講：質能平衡與熱力學","pages":"9","source":"ChE_04"},{"id":80,"text":"若電壓為 10 V、電流為 2 A，在適用 P = VI 的條件下，電功率為 20 W。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"9","source":"ChE_04"},{"id":81,"text":"一顆具有 53 kJ 能量的電池，不論在 10 秒或一整天放完，平均功率都相同。","answer":false,"explanation":"平均功率為能量除以時間，放電愈快，功率愈大。","category":"第四講：質能平衡與熱力學","pages":"11","source":"ChE_04"},{"id":83,"text":"依投影片比較，燃油 Camry 每公里消耗的燃料化學能小於 Tesla 的電池輸出能量。","answer":false,"explanation":"投影片估算 Camry 約 2.26 MJ/km，Tesla 約 0.6 MJ/km；比較的是所選範例的輸入能量。","category":"第四講：質能平衡與熱力學","pages":"12","source":"ChE_04"},{"id":84,"text":"汽油引擎的燃料能量並非全部變成車輪上的有用功。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"14","source":"ChE_04"},{"id":85,"text":"能量守恆定律本身足以判斷熱量為什麼不會自發從低溫物體傳到高溫物體。","answer":false,"explanation":"能量守恆只限制能量數量；自然過程的方向性還需要熵平衡與熱力學第二定律。","category":"第四講：質能平衡與熱力學","pages":"19","source":"ChE_04"},{"id":87,"text":"熱量可以不需任何外部作功，自發地由低溫環境持續傳給高溫環境。","answer":false,"explanation":"這違反熱力學第二定律；冰箱與熱泵需要外部功輸入。","category":"第四講：質能平衡與熱力學","pages":"20","source":"ChE_04"},{"id":88,"text":"循環運作的熱機不可能把從單一熱源吸收的所有熱量都轉換成淨功。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"20","source":"ChE_04"},{"id":90,"text":"當冷端溫度固定時，提高熱端溫度會增加 Carnot 熱機的最大效率。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"23","source":"ChE_04"},{"id":91,"text":"冰箱的 COP 定義為輸出功率除以吸收的低溫熱量。","answer":false,"explanation":"冰箱 COP = Q̇L/Ẇ，為從低溫端移除的熱量率除以功率輸入。","category":"第四講：質能平衡與熱力學","pages":"24","source":"ChE_04"},{"id":92,"text":"熱泵的 COP 定義為傳送至高溫端的熱量率除以輸入功率。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"24","source":"ChE_04"},{"id":93,"text":"冰箱和熱泵的 COP 在任何情況下都不能大於 1。","answer":false,"explanation":"COP 是熱傳量與作功的比值，並非熱轉功效率，可以大於 1。","category":"第四講：質能平衡與熱力學","pages":"24","source":"ChE_04"},{"id":95,"text":"用於 Carnot 效率與 COP 公式的溫度，可以直接代入攝氏溫度而不必換算。","answer":false,"explanation":"Carnot 公式中的 TH、TL 必須使用絕對溫標 K。","category":"第四講：質能平衡與熱力學","pages":"24","source":"ChE_04"},{"id":96,"text":"水的沸點會隨壓力改變，因此水有可能在低於 100°C 的溫度下沸騰。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"31","source":"ChE_04"},{"id":97,"text":"水在三相點附近只能存在氣態，不可能有固態或液態共存。","answer":false,"explanation":"三相點是固、液、氣三相在平衡條件下共存的狀態。","category":"第四講：質能平衡與熱力學","pages":"31","source":"ChE_04"},{"id":98,"text":"當 CO₂ 的溫度及壓力都高於臨界值時，可處於超臨界流體狀態。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"32","source":"ChE_04"},{"id":99,"text":"只要持續提高壓力，任何高於臨界溫度的純物質氣體都必然發生傳統的氣液相變。","answer":false,"explanation":"高於臨界溫度時不存在傳統的氣液共存邊界；加壓可使流體密度連續變大，進入超臨界狀態。","category":"第四講：質能平衡與熱力學","pages":"32","source":"ChE_04"},{"id":100,"text":"乙醇與水的氣液平衡可能出現共沸點，影響普通蒸餾的分離效果。","answer":true,"explanation":"","category":"第四講：質能平衡與熱力學","pages":"34","source":"ChE_04"},{"id":101,"text":"質量與能量遵守守恆定律，但熵並不是一般意義下的守恆量。","answer":true,"explanation":"","category":"期中考延伸：熱力學與能量","pages":"1、4","source":"2026 Midterm Sample Problems"},{"id":102,"text":"在完全隔熱的房間中，一部消耗 500 W 的電腦與一台 500 W 電暖器持續運作，電暖器必定使房間升溫得更快。","answer":false,"explanation":"若電腦及電暖器消耗的 500 W 電力最後全部在室內轉化為熱量，且沒有其他能量輸出，兩者的平均室內產熱率相同。","category":"期中考延伸：熱力學與能量","pages":"1","source":"2026 Midterm Sample Problems"},{"id":104,"text":"在汽車車頂加裝風車發電，就能在不增加引擎負擔的條件下額外取得電能。","answer":false,"explanation":"風車發電會增加空氣阻力；若能量來自汽車相對空氣的運動，最終仍需由車輛提供額外推進功。","category":"期中考延伸：能源與運輸","pages":"1","source":"2026 Midterm Sample Problems"},{"id":105,"text":"在相同條件下，將 500 MW 電廠熱端由 500°C 提高至 600°C、冷端維持 30°C，可以提高理想熱機的最大效率。","answer":true,"explanation":"","category":"期中考延伸：熱機與冷凍","pages":"1","source":"2026 Midterm Sample Problems"},{"id":107,"text":"100 kWh 的電池若能讓車子行駛 600 km，則平均電池能耗約為 0.6 MJ/km。","answer":true,"explanation":"","category":"期中考延伸：能源與運輸","pages":"2","source":"2026 Midterm Sample Problems"},{"id":108,"text":"一部燃油車每公里消耗 2.26 MJ 的燃料化學能，另一部電動車每公里消耗 0.6 MJ 的電池能量，就足以直接證明電動車從一次能源到車輪的整體效率一定更高。","answer":false,"explanation":"比較基準不同；若評估整體能源效率，還需計入發電、燃料供應、充電與其他上游損失。","category":"期中考延伸：能源與運輸","pages":"2","source":"2026 Midterm Sample Problems"},{"id":109,"text":"若電動車充入 50 kWh 能量需 15 分鐘，忽略損失時，平均充電功率為 200 kW。","answer":true,"explanation":"","category":"期中考延伸：能源與運輸","pages":"2","source":"2026 Midterm Sample Problems"},{"id":111,"text":"在常溫常壓下石墨比鑽石在熱力學上更穩定，但鑽石仍可能因轉化速率極慢而長期存在。","answer":true,"explanation":"","category":"期中考延伸：熱力學與能量","pages":"2","source":"2026 Midterm Sample Problems"},{"id":112,"text":"只要某物質在熱力學上不穩定，就代表它一定會在幾秒鐘內消失。","answer":false,"explanation":"熱力學決定平衡傾向，不決定轉化速率；動力學障礙可能使物質長期存在。","category":"期中考延伸：熱力學與能量","pages":"2","source":"2026 Midterm Sample Problems"},{"id":113,"text":"熱泵可以使輸送至熱水的熱量大於所消耗的電能，而不違反能量守恆。","answer":true,"explanation":"","category":"期中考延伸：熱機與冷凍","pages":"2","source":"2026 Midterm Sample Problems"},{"id":114,"text":"水霧風扇的降溫原理主要是水蒸發吸熱，因此在非常潮濕的環境下通常較難發揮效果。","answer":true,"explanation":"","category":"期中考延伸：熱機與冷凍","pages":"2","source":"2026 Midterm Sample Problems"},{"id":115,"text":"在完全密閉且沒有任何熱量向外排出的房間中，使用水霧風扇可以持續降低整個房間的總熱能。","answer":false,"explanation":"蒸發冷卻是能量的重新分配；若沒有熱量向外排出，並不能持續降低房間總能量，風扇耗電反而增加室內能量。","category":"期中考延伸：熱機與冷凍","pages":"2","source":"2026 Midterm Sample Problems"},{"id":117,"text":"對冷凍機而言，從低溫物體移除的熱量率可以大於壓縮機的輸入功率。","answer":true,"explanation":"","category":"期中考延伸：熱機與冷凍","pages":"2","source":"2026 Midterm Sample Problems"},{"id":120,"text":"氣體常數 R = 8.314 J/(mol·K) 約等於 1.99 cal/(mol·K)。","answer":true,"explanation":"","category":"期中考延伸：單位與計算","pages":"3、5","source":"2026 Midterm Sample Problems"},{"id":122,"text":"使用天然氣製氫搭配水蒸氣重組，是傳統工業合成氨製程的氫氣來源之一。","answer":true,"explanation":"","category":"期中考延伸：化工與半導體製程","pages":"4","source":"2026 Midterm Sample Problems"},{"id":124,"text":"只要薄膜沉積的厚度非常均勻，複雜多層互連製程就一定不再需要 CMP。","answer":false,"explanation":"CMP 不僅處理薄膜均勻性，也處理圖案造成的表面高低差、整體平坦化與去除多餘金屬。","category":"期中考延伸：化工與半導體製程","pages":"4","source":"2026 Midterm Sample Problems"},{"id":125,"text":"矽的純化過程可先利用化學反應形成三氯矽烷，再經分離純化和沉積獲得高純度矽。","answer":true,"explanation":"","category":"期中考延伸：化工與半導體製程","pages":"4","source":"2026 Midterm Sample Problems"},{"id":127,"text":"當半導體製程從 10 nm 推進至 7 nm 或 3 nm，代表所有薄膜沉積、蝕刻與清洗步驟都必須改用完全不同的物理原理。","answer":false,"explanation":"先進製程雖需調整材料、設備、精度及部分結構，但許多單元操作的基本原理仍持續使用。","category":"期中考延伸：化工與半導體製程","pages":"5","source":"2026 Midterm Sample Problems"},{"id":128,"text":"現代處理器的時脈頻率無法無限制提高，部分原因是功率密度與散熱限制。","answer":true,"explanation":"","category":"期中考延伸：化工與半導體製程","pages":"5","source":"2026 Midterm Sample Problems"}];
const $=id=>document.getElementById(id);
const byId=new Map(QUESTIONS.map(q=>[q.id,q]));
for(const cat of [...new Set(QUESTIONS.map(q=>q.category))]){const n=document.createElement('option');n.value=cat;n.textContent=cat+'（'+QUESTIONS.filter(q=>q.category===cat).length+' 題）';$('category').append(n)}
let deck=[],index=0,answers={},results=[],revealed=false,stopped=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function current(){return deck.slice(index,index+3)}
function el(parent,tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;parent.append(n);return n}
function updateStats(){const t=deck.length,d=results.length,c=results.filter(r=>r.correct).length;$('total').textContent=t;$('done').textContent=d;$('score').textContent=d?Math.round(100*c/d)+'%':'—';$('round').textContent=t?Math.min(Math.floor(index/3)+1,Math.ceil(t/3)):'—';$('bar').style.width=t?100*d/t+'%':'0%'}
function start(){deck=shuffle(QUESTIONS.filter(q=>$('category').value==='all'||q.category===$('category').value).map(q=>q.id));index=0;answers={};results=[];revealed=false;stopped=false;$('summary').classList.add('hide');$('questions').classList.remove('hide');$('phase').classList.remove('hide');$('actions').classList.remove('hide');render()}
function render(){updateStats();const batch=current(),root=$('questions');root.replaceChildren();if(!batch.length){showSummary();return}
const filled=batch.filter(id=>answers[id]!==undefined).length;
$('phase').textContent='第 '+(Math.floor(index/3)+1)+' / '+Math.ceil(deck.length/3)+' 回合：本回合 '+batch.length+' 題，已選 '+filled+' 題。'+(revealed?'本回合已批改，請進入下一回合。':'請先回答全部題目，答案將一起公布。');
for(const id of batch){const q=byId.get(id),card=el(root,'article','card');const top=el(card,'div','top');el(top,'span','', '第 '+q.id+' 題　｜　'+q.category);el(top,'span','',q.source+'・第 '+q.pages+' 頁');el(card,'div','question',q.text);const opts=el(card,'div','answers');for(const val of [true,false]){const b=el(opts,'button',answers[id]===val?'chosen':'',val?'○ 正確':'✕ 錯誤');b.type='button';b.setAttribute('aria-pressed',String(answers[id]===val));b.disabled=revealed;b.addEventListener('click',()=>{if(revealed)return;answers[id]=val;render()})}if(revealed){const ok=answers[id]===q.answer;const box=el(card,'div','feedback '+(ok?'good':'bad'),(ok?'✓ 答對':'✕ 答錯')+'｜標準答案：'+(q.answer?'○ 正確':'✕ 錯誤'));if(!q.answer)el(box,'div','explain','解釋：'+q.explanation)}}
$('submit').classList.toggle('hide',revealed);$('submit').disabled=filled!==batch.length;$('submit').textContent='提交本回合 '+batch.length+' 題並查看答案';$('next').classList.toggle('hide',!revealed||index+batch.length>=deck.length);$('finish').classList.toggle('hide',!revealed||index+batch.length<deck.length);$('hint').textContent=revealed?'本回合結果已公布。':('已作答 '+filled+' / '+batch.length+' 題');}
function grade(){const batch=current();if(revealed||!batch.length||batch.some(id=>answers[id]===undefined))return;for(const id of batch){const q=byId.get(id);results.push({id,choice:answers[id],correct:answers[id]===q.answer})}revealed=true;render();$('actions').scrollIntoView({block:'nearest',behavior:'smooth'})}
function advance(){if(!revealed)return;index+=current().length;answers={};revealed=false;render();$('phase').scrollIntoView({block:'start',behavior:'smooth'})}
function showSummary(force=false){
if(!force && (!revealed||index+current().length!==deck.length))return;
if(force){
  // Already-graded rounds are stored in results. Count any answers selected in the unfinished round once.
  if(!revealed){for(const id of current())if(answers[id]!==undefined&&!results.some(r=>r.id===id)){
    const q=byId.get(id);results.push({id,choice:answers[id],correct:answers[id]===q.answer});
  }}
  stopped=true;
}
$('questions').classList.add('hide');$('phase').classList.add('hide');$('actions').classList.add('hide');$('summary').classList.remove('hide');
const wrong=results.filter(r=>!r.correct),correct=results.length-wrong.length,unanswered=deck.length-results.length;
$('summaryTitle').textContent=stopped?'📋 中途停止：目前成績與錯題總整理':'🎓 本局完成：成績與錯題總整理';
$('finalstats').textContent='本局共 '+deck.length+' 題；已作答 '+results.length+' 題，答對 '+correct+' 題，答錯 '+wrong.length+' 題，尚未作答 '+unanswered+' 題。'+(results.length?'已作答答對率 '+Math.round(100*correct/results.length)+'%。':'尚未作答，因此沒有答對率。');
const list=$('wrongList');list.replaceChildren();
if(!wrong.length){el(list,'p','',results.length?'目前已作答題目全部答對，沒有錯題。':'目前尚無作答紀錄或錯題。')}
else{el(list,'h3','','答錯的 '+wrong.length+' 題：');for(const r of wrong){const q=byId.get(r.id),item=el(list,'div','wrong-entry');el(item,'strong','','第 '+q.id+' 題｜'+q.text);el(item,'p','','你的答案：'+(r.choice?'正確':'錯誤')+'　／　標準答案：'+(q.answer?'正確':'錯誤'));if(q.explanation)el(item,'p','','解釋：'+q.explanation);else el(item,'p','','解釋：此敘述正確，請回顧該觀念。');el(item,'div','small',q.category+'｜'+q.source+' 第 '+q.pages+' 頁')}}
updateStats();$('summary').scrollIntoView({block:'start',behavior:'smooth'});
}
function stopNow(){const pending=!revealed?current().filter(id=>answers[id]!==undefined).length:0;
const message='確定停止本次練習並查看 Summary？\n已完成的回合都會計分'+(pending?'，本回合已選的 '+pending+' 題也會計分':'')+'；尚未作答的題目不計分。';
if(confirm(message))showSummary(true);
}
$('submit').addEventListener('click',grade);$('next').addEventListener('click',advance);$('finish').addEventListener('click',()=>showSummary());$('stop').addEventListener('click',stopNow);$('category').addEventListener('change',()=>{if(results.length||Object.keys(answers).length){if(!confirm('切換章節會清除目前練習紀錄，確定嗎？')){ $('category').value=deck.length===QUESTIONS.length?'all':byId.get(deck[0]).category;return}}start()});$('restart').addEventListener('click',()=>{if((results.length||Object.keys(answers).length)&&!confirm('確定重新開始？原成績將清除。'))return;start()});$('again').addEventListener('click',()=>{start();window.scrollTo({top:0,behavior:'smooth'})});$('print').addEventListener('click',()=>window.print());start();
</script></body></html>
